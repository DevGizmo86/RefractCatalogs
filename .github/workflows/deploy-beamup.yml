name: Deploy to Beamup

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: beamup-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a release tag such as v0.1.1." >&2
            exit 1
          fi
          git fetch origin main --no-tags
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "The release tag must point to the current main commit." >&2
            exit 1
          fi
          node <<'NODE'
          const expected = process.env.RELEASE_TAG.slice(1);
          const actual = require('./package.json').version;
          const lock = require('./package-lock.json').version;
          if (actual !== expected || lock !== expected) {
            throw new Error(`Tag v${expected}, package.json ${actual}, package-lock.json ${lock} must match`);
          }
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code and run tests
        run: |
          set -euo pipefail
          npm run check
          npm test

      - name: Deploy tagged commit to Beamup
        env:
          BEAMUP_REMOTE: ${{ secrets.BEAMUP_REMOTE }}
          BEAMUP_SSH_PRIVATE_KEY: ${{ secrets.BEAMUP_SSH_PRIVATE_KEY }}
          BEAMUP_SSH_KNOWN_HOSTS: ${{ secrets.BEAMUP_SSH_KNOWN_HOSTS }}
          BEAMUP_BRANCH: ${{ vars.BEAMUP_BRANCH || 'master' }}
        run: |
          set -euo pipefail
          for secret_name in BEAMUP_REMOTE BEAMUP_SSH_PRIVATE_KEY BEAMUP_SSH_KNOWN_HOSTS; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing GitHub Actions secret: ${secret_name}" >&2
              exit 1
            fi
          done
          git check-ref-format "refs/heads/$BEAMUP_BRANCH"
          install -m 700 -d "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/beamup_deploy"' EXIT
          printf '%s\n' "$BEAMUP_SSH_PRIVATE_KEY" > "$HOME/.ssh/beamup_deploy"
          chmod 600 "$HOME/.ssh/beamup_deploy"
          printf '%s\n' "$BEAMUP_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          unset BEAMUP_SSH_PRIVATE_KEY BEAMUP_SSH_KNOWN_HOSTS
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/beamup_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          git remote add beamup "$BEAMUP_REMOTE"
          git push beamup "HEAD:refs/heads/$BEAMUP_BRANCH"
